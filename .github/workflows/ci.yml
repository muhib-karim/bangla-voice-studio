name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      BVS_TEST_MODE: '1'
      BVS_OFFLINE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BVS_DATA_DIR: ${{ runner.temp }}/bvs-data
      BVS_MODEL_CACHE: ${{ runner.temp }}/bvs-models
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base and development tools only
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install '.[dev]' pyyaml
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Lint and types
        run: |
          .venv/bin/ruff check src tests scripts
          .venv/bin/ruff format --check src tests scripts
          .venv/bin/mypy src tests scripts
      - name: Validate workflow YAML
        run: |
          .venv/bin/python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text()) for p in Path('.github/workflows').glob('*.yml')]"
      - name: Model-free tests
        run: .venv/bin/python -m pytest -q -x --junitxml=test-results/pytest.xml
      - name: Build and verify a fresh wheel installation
        run: |
          .venv/bin/python -m build
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/bvs" --help
          "$RUNNER_TEMP/wheel-env/bin/bvs" normalize '৳৫০'
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from importlib.resources import files; import sys; p=files('bvs.web')/'static'; assert (p/'index.html').is_file(); assert (p/'fonts/NotoSansBengali.ttf').is_file(); assert (p/'fonts/OFL.txt').is_file(); assert not {'torch','transformers','faster_whisper'} & sys.modules.keys()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checks-${{ matrix.python }}
          path: |
            test-results/
            dist/
          retention-days: 14
