[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bangla-voice-studio"
version = "0.1.0"
description = "Local Bangla text preparation, speech jobs, and captions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Muhib Karim"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "typer>=0.12,<1", "numpy>=1.26,<3", "python-multipart>=0.0.18", "pydantic>=2.9,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
mms = ["torch>=2.4,<3", "transformers>=4.46,<5", "huggingface-hub>=0.26,<1", "scipy>=1.13"]
asr = ["faster-whisper>=1.1,<2", "huggingface-hub>=0.26,<1"]
whisper = ["bangla-voice-studio[asr]"]
indic-parler = ["parler-tts>=0.2", "huggingface-hub>=0.26,<1"]
indicf5 = ["f5-tts>=1.1", "huggingface-hub>=0.26,<1"]
omnivoice = ["omnivoice", "huggingface-hub>=0.26,<1"]
voxcpm2 = []
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.13", "build>=1.2"]
e2e = ["playwright>=1.48", "pytest-playwright>=0.6"]

[project.scripts]
bvs = "bvs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bvs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not e2e and not models'"
markers = ["e2e: browser tests (CI only)", "models: real model tests (remote only)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bvs"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "faster_whisper.*", "huggingface_hub.*", "parler_tts.*", "f5_tts.*", "omnivoice.*"]
ignore_missing_imports = true
