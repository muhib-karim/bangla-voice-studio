name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      BVS_TEST_MODE: '1'
      BVS_E2E: '1'
      BVS_OFFLINE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BVS_DATA_DIR: /tmp/bvs-e2e
      BVS_MODEL_CACHE: /tmp/bvs-empty-models
      BVS_BASE_URL: http://127.0.0.1:8000
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install base, browser tools and ffmpeg
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install '.[dev,e2e]'
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run browser workflows against dummy and fake ASR
        run: |
          mkdir -p test-results screenshots
          .venv/bin/bvs serve --demo > test-results/server.log 2>&1 &
          BVS_SERVER_PID=$!
          trap 'kill "$BVS_SERVER_PID" 2>/dev/null || true; wait "$BVS_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BVS_BASE_URL/health" > /dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent "$BVS_BASE_URL/health"
          .venv/bin/python -m pytest -q -x -m e2e tests/e2e --browser chromium --tracing retain-on-failure --screenshot on --video retain-on-failure --output test-results/browser
      - name: Build labelled UI demo GIF
        if: matrix.python == '3.11'
        run: |
          mkdir -p docs
          ffmpeg -nostdin -y -framerate 1/2 -i screenshots/demo-%02d.png -filter_complex '[0:v]scale=960:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer' -loop 0 docs/demo.gif
          test "$(stat -c %s docs/demo.gif)" -le 8388608
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-${{ matrix.python }}
          path: |
            test-results/
            screenshots/
            docs/demo.gif
          retention-days: 14
