name: Docker

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build model-free CPU image
        run: docker build --target runtime -t bvs:check .
      - name: Verify non-root volumes and offline dummy synthesis
        run: |
          docker run --rm --network none --entrypoint /bin/sh bvs:check -c 'test "$(id -u)" = 10001 && test -w /models && test -w /data'
          docker run --rm --network none -e BVS_TEST_MODE=1 bvs:check say 'আমি বাংলায় বলি।' --engine dummy --output /data/demo.wav --srt
          if docker run --rm bvs:check serve --host 0.0.0.0; then
            echo 'Broad binding must refuse startup without a token'
            exit 1
          fi
      - name: Verify published port, health, authentication and packaged UI
        run: |
          BVS_API_TOKEN=$(openssl rand -hex 32)
          export BVS_API_TOKEN
          echo "::add-mask::$BVS_API_TOKEN"
          docker run --detach --name bvs-check -p 127.0.0.1:8000:8000 -e BVS_API_TOKEN -e BVS_TEST_MODE=1 bvs:check serve --demo --host 0.0.0.0
          trap 'docker logs bvs-check; docker rm -f bvs-check' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8000/health
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/speak)" = 401
          curl --fail --silent --user "bvs:$BVS_API_TOKEN" http://127.0.0.1:8000/speak > shell.html
          grep -q '/static/app.js' shell.html
          curl --fail --silent -H "Authorization: Bearer $BVS_API_TOKEN" http://127.0.0.1:8000/api/v1/engines > /dev/null
          curl --fail --silent --user "bvs:$BVS_API_TOKEN" http://127.0.0.1:8000/static/fonts/OFL.txt > /dev/null
      - name: Publish versioned CPU image on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          BVS_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag bvs:check "$BVS_IMAGE:$RELEASE_TAG-cpu"
          docker tag bvs:check "$BVS_IMAGE:cpu"
          docker push "$BVS_IMAGE:$RELEASE_TAG-cpu"
          docker push "$BVS_IMAGE:cpu"
          docker image inspect "$BVS_IMAGE:$RELEASE_TAG-cpu" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
