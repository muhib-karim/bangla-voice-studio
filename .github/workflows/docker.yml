name: Docker

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build model-free CPU image
        run: docker build --target runtime -t bvs:check .
      - name: Container smoke (non-root volumes, offline dummy output, token guard, port, auth, UI, SIGTERM)
        run: bash scripts/container_smoke.sh bvs:check
      - name: Publish versioned CPU image on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          BVS_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag bvs:check "$BVS_IMAGE:$RELEASE_TAG-cpu"
          docker tag bvs:check "$BVS_IMAGE:cpu"
          docker push "$BVS_IMAGE:$RELEASE_TAG-cpu"
          docker push "$BVS_IMAGE:cpu"
          docker image inspect "$BVS_IMAGE:$RELEASE_TAG-cpu" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
